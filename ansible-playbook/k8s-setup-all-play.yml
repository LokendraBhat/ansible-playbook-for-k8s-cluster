---
- name: Setup Kubernetes on all nodes
  hosts: all
  become: yes
  tasks:

    - name: Disable SELinux
      selinux:
        state: disabled

    - name: Stop and disable firewalld
      service:
        name: firewalld
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Update all packages
      yum:
        name: "*"
        state: latest

    - name: Disable swap
      command: swapoff -a
      become: yes

    - name: Comment out swap in fstab
      lineinfile:
        path: /etc/fstab
        regexp: '(\s+/swap\s+)'
        line: '#\1'
        backrefs: yes

    - name: Install tools and dependencies
      yum:
        name:
          - telnet
          - wget
          - curl
          - bind-utils
          - sysstat
          - git
          - net-tools
          - tar
          - gzip
          - zip
          - unzip
          - rsync
          - vim
          - epel-release
          - netcat
          - htop
        state: present

    - name: Load kernel modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Ensure kernel modules are loaded
      command: modprobe overlay && modprobe br_netfilter

    - name: Set sysctl params
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl settings
      command: sysctl --system

    - name: Install yum-utils for Docker
      dnf:
        name: yum-utils
        state: present

    - name: Add Docker repo
      get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo

    - name: Install containerd
      dnf:
        name: containerd.io
        state: present

    - name: Configure containerd for systemd cgroup
      command: containerd config default | tee /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Update containerd config for systemd cgroup
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^SystemdCgroup\s=\sfalse'
        line: 'SystemdCgroup = true'

    - name: Restart and enable containerd
      service:
        name: containerd
        state: restarted
        enabled: yes

    - name: Add Kubernetes repo
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v1.30/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v1.30/rpm/repodata/repomd.xml.key
          exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

    - name: Install Kubernetes components
      yum:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes

    - name: Enable and start kubelet
      service:
        name: kubelet
        state: started
        enabled: yes

    - name: Check kubelet status
      command: systemctl status kubelet
      register: kubelet_status

    - debug:
        var: kubelet_status
